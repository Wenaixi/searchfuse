name: ci

on:
  push:
    branches: [main]
  pull_request:
  # fork 仓库的 push 事件不一定触发流水线（取决于 Actions 的默认策略），
  # 手动触发是把它跑起来的唯一稳定办法。
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # action-setup 必须能找到一个版本来源，否则报「No pnpm version is
      # specified」。只写在这里、不写 package.json 的 packageManager：两处同时
      # 声明会报「Multiple versions of pnpm specified」。version: 12 会装 12.x 最新。
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu 跑满三个 Node：它是主平台，版本边界最该在这里验。
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          # windows 只测两端：22 是声明下限，26 是本机在跑的那个。中间的 24
          # 与 22/26 之间没有 windows 特有的分支，测它只是多排一次队。
          - os: windows-latest
            node: 22
          - os: windows-latest
            node: 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # action-setup 必须能找到一个版本来源，否则报「No pnpm version is
      # specified」。只写在这里、不写 package.json 的 packageManager：两处同时
      # 声明会报「Multiple versions of pnpm specified」。version: 12 会装 12.x 最新。
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # build 必须在 test 之前：dist/ 与 dsh/*.js 都是 gitignore 的构建产物，
      # 而 kernel.contract.test.ts 跑的是真实的 dist/kernel.js 子进程，
      # dshPlugin.test.ts 直接读 dsh/index.js 与 dsh/client.js。
      # 顺序反过来的话 checkout 之后这些文件根本不存在，测试会报 ENOENT。
      - run: pnpm build
      - run: pnpm test

  audit:
    # 依赖审计单独一个 job：它只需要一个 runner，而且失败信息与测试失败是
    # 两类完全不同的修法，混在矩阵里会让人以为六个平台都红了。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # action-setup 必须能找到一个版本来源，否则报「No pnpm version is
      # specified」。只写在这里、不写 package.json 的 packageManager：两处同时
      # 声明会报「Multiple versions of pnpm specified」。version: 12 会装 12.x 最新。
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 只审生产依赖：开发工具链里的告警不随包发布，把它们算进来只会
      # 制造与用户无关的噪音。
      - run: pnpm audit --prod
