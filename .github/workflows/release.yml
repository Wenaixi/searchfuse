name: release

# Publishes to npm and creates the GitHub release when a version tag is pushed
# (e.g. v0.1.0). Verifies first, then publishes. This is the single publisher:
# `pnpm release` only prepares and pushes the tag, it does not publish, so there
# is no second process racing this one.
#
# AUTHORIZATION, in the order it actually works:
#   - First publish of a brand-new package CANNOT use OIDC trusted publishing:
#     npm only lets you attach a Trusted Publisher to a package that already
#     exists (`npm trust list` answers 403 for an unclaimed name). The bootstrap
#     publish therefore authenticates with the NPM_TOKEN secret.
#   - Once the package exists, run `npm trust github @wenaixi/searchfuse
#     --file .github/workflows/release.yml --allow-publish` once. From then on
#     OIDC works and the token can be deleted from the repo secrets.
#
# The job tries OIDC first and falls back to the token, so neither setup has to
# be torn down for the other: `--provenance` attaches a verifiable build
# attestation whenever the run is authenticated by OIDC.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub release
  id-token: write # required for npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 版本由 package.json 的 packageManager 决定；这里再写 version 会让
      # action-setup 报「Multiple versions of pnpm specified」并直接失败。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # OIDC trusted publishing needs npm 11.5.1+, newer than what Node 22
      # ships with. pnpm publish cannot do the OIDC token exchange at all: the
      # 4.1.0 first attempt signed provenance fine and then got a masked 404 on
      # the registry PUT because the request carried no credential.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Idempotent: a manual publish (e.g. during a registry or Actions
      # incident) must not turn this run red when the tag arrives later.
      #
      # OIDC 优先、token 兜底。npm 对已有 Trusted Publisher 的包才会给 OIDC
      # 换发凭据；一个全新的包名只能靠 NODE_AUTH_TOKEN 引导第一次。先试 OIDC，
      # 失败且确实有 secret 时再退回 token，这样配好 trust 之后不需要回来删代码。
      - name: Publish to npm (skipped when the version is already live)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').name")"
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG@$VERSION is already on the registry; skipping publish."
            exit 0
          fi
          echo "Publishing $PKG@$VERSION"
          if npm publish --provenance --access public; then
            exit 0
          fi
          echo "OIDC publish failed; retrying with the NPM_TOKEN secret (bootstrap path)." >&2
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "No NPM_TOKEN secret is configured, and trusted publishing is not set up for this package." >&2
            exit 1
          fi
          npm publish --access public
      - name: Build release notes from CHANGELOG
        run: >
          node --input-type=module -e "
          import { readFileSync, writeFileSync } from 'node:fs';
          import { changelogSection } from './scripts/changelog.mjs';
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const notes = changelogSection(readFileSync('CHANGELOG.md', 'utf-8'), version) ?? '';
          writeFileSync('RELEASE_NOTES.md', notes);
          "
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
